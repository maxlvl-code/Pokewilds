name: GBA Engine Build
on:
  push:
    branches: [ "prototype/seeded-wilderness" ]
  workflow_dispatch:

jobs:
  build-gba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pokewilds
      - name: Fetch pinned pokeemerald-expansion
        run: git clone --depth 1 --branch expansion/1.17.0 https://github.com/rh-hideout/pokeemerald-expansion.git engine
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev pkg-config
      - name: Build engine with modern toolchain
        working-directory: engine
        run: |
          make modern TOOLCHAIN=/usr -j2
      - name: Inspect ROM
        run: |
          ls -lh engine/pokeemerald.gba engine/pokeemerald.elf
          sha256sum engine/pokeemerald.gba
      - uses: actions/upload-artifact@v4
        with:
          name: gba-engine-build
          path: |
            engine/pokeemerald.gba
            engine/pokeemerald.elf
